$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

name: churn-train-job
display_name: churn-train-job
experiment_name: churn-mlops

compute: azureml:cpu-cluster

# 👇 This ensures Azure ML uploads the repo root (so it sees src/, data/, env/)
code: ..

environment:
  conda_file: ../env/environment.yml      # 👈 fixed path
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest

command: >
  python src/train.py
  --data-path ${{inputs.training_data}}
  --output-dir ${{outputs.model_output}}

inputs:
  training_data:
    type: uri_file
    path: ../data/customer_churn_dataset-training-master.csv   # 👈 fixed path

outputs:
  model_output:
    type: uri_folder
