$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

# name: churn-train-job       # <-- remove this line
display_name: churn-train-job
experiment_name: churn-mlops


compute: azureml:cpu-cluster

environment:
  conda_file: ../env/environment.yml                 # fixed
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest

command: >
  python src/train.py
  --data-path ${{inputs.training_data}}
  --output-dir ${{outputs.model_output}}


inputs:
  training_data:
    type: uri_file
    path: ../data/customer_churn_dataset-training-master.csv   # ✅ fixed for data

outputs:
  model_output:
    type: uri_folder
